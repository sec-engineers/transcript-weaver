name: CI
on:
  push:
  pull_request:
jobs:
  test:
    name: ${{ matrix.name }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-24.04
            python-version: "3.10"
          - name: Linux
            runner: ubuntu-24.04
            python-version: "3.11"
          - name: Linux
            runner: ubuntu-24.04
            python-version: "3.12"
          - name: Windows
            runner: windows-latest
            python-version: "3.12"
          - name: macOS Apple silicon
            runner: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]" -e "./plugins/highlevel"
      - run: pytest -m "not live_otter and not live_gemini and not live_highlevel"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - if: matrix.runner == 'ubuntu-24.04' && matrix.python-version == '3.12'
        run: python -m transcript_weaver.build
