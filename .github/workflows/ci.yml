name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]" -e "./plugins/highlevel"
      - run: pytest -m "not live_otter and not live_gemini and not live_highlevel"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python -m transcript_weaver.build
